<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import GEDCOM</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 16px; max-width: 40rem; }
        #log { white-space: pre-wrap; background: #f4f4f4; padding: 8px; min-height: 4em; }
    </style>
</head>

<body>
    <h1>Import GEDCOM</h1>
    <p id="status">Checking sign-in…</p>
    <input id="file" type="file" accept=".ged" disabled>
    <pre id="log"></pre>
    <button id="run" hidden>Delete existing people and import</button>

    <script type="module">
        import { initImportPage } from "./import.js";
        initImportPage();
    </script>
</body>

</html>
